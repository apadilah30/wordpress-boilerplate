; ==============================================================================
; WordPress Boilerplate — PHP defaults (dipakai dev & prod)
; Per-env override ada di conf.d/ dari Dockerfile.
; ==============================================================================

; --- Errors ---
; Prod: display_errors=0 di production.php runtime. Ini default aman.
display_errors        = Off
display_startup_errors = Off
log_errors            = On
error_log             = /proc/self/fd/2

; --- Upload / post ---
; WordPress + Elementor sering butuh 32M+. 64M cukup untuk foto standar.
upload_max_filesize   = 64M
post_max_size         = 64M
max_file_uploads      = 20
memory_limit          = 256M
max_execution_time    = 120
max_input_time        = 120
max_input_vars        = 3000

; --- Session ---
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure   = 1
session.cookie_samesite = "Lax"

; --- Security ---
expose_php            = Off
allow_url_fopen       = On
allow_url_include     = Off

; --- Date ---
date.timezone         = "UTC"

; --- Opcache defaults (prod ditune lebih agresif via conf.d) ---
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 128
opcache.max_accelerated_files   = 10000
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 2
opcache.fast_shutdown           = 1

; --- Realpath cache (perf) ---
realpath_cache_size            = 4096K
realpath_cache_ttl             = 600
