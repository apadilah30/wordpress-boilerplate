# ==============================================================================
# Staging overrides — image dari registry, no source mount, port publish.
# Jalankan: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# ==============================================================================

services:
  app:
    image: "${DEPLOY_IMAGE}:${DEPLOY_TAG:-staging}"
    environment:
      APP_ENV: production   # staging jalan config prod tapi WP_ENV=staging
      WP_ENV:  staging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE

  db:
    # DB tidak expose ke host di staging
    ports: []

  redis:
    ports: []
