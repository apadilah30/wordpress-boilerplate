# ==============================================================================
# Staging overrides — image dari registry, no source mount, port publish.
# Jalankan: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# ==============================================================================

services:
  app:
    image: "${DEPLOY_IMAGE}:${DEPLOY_TAG:-staging}"
    environment:
      APP_ENV: production   # staging jalan config prod tapi WP_ENV=staging
      WP_ENV:  staging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    volumes:
      # app_source: expose /app dari container app ke backup service
      - app_source:/app:ro

  db:
    # DB tidak expose ke host di staging
    ports: []

  redis:
    ports: []

  # Backup aktif di staging: backup DB + project setiap hari pukul 03:00
  backup:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
