# ==============================================================================
# Dev overrides — build local, mount source, expose ports untuk debug.
# Jalankan: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: .docker/frankenphp/Dockerfile
      target: dev
    image: wp-boilerplate:dev
    environment:
      APP_ENV: development
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount source: perubahan langsung visible tanpa rebuild
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
      - ./config:/app/config
      - ./web/index.php:/app/web/index.php
      - ./web/wp-config.php:/app/web/wp-config.php
      - ./web/app/mu-plugins:/app/web/app/mu-plugins
      - ./web/app/themes:/app/web/app/themes
      - ./plugins-custom:/app/plugins-custom
      - uploads:/app/web/app/uploads
    # Xdebug butuh route ke host
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    ports:
      # Expose ke localhost supaya bisa connect dari DBeaver/TablePlus
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"
