# ==============================================================================
# Dev overrides — build local, mount source, expose ports untuk debug.
# Jalankan: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Design:
# - Source code (config/, themes, mu-plugins, plugins-custom, composer.json)
#   di-bind-mount dari host supaya edit langsung visible tanpa rebuild.
# - Composer-managed folder (vendor/, web/wp/, web/app/plugins/) pakai NAMED
#   VOLUME supaya persist antar restart tapi tidak polusi host filesystem.
# - First-time setup: `composer install` jalan otomatis di entrypoint. Tunggu
#   sampai selesai sebelum `wp core install` — lihat README.
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: .docker/frankenphp/Dockerfile
      target: dev
    image: wp-boilerplate:dev
    environment:
      APP_ENV: development
      # Force Caddy to serve HTTP only in dev (no auto-HTTPS redirect).
      # Prefix `http://` disables Caddy auto-HTTPS. Prod pakai domain tanpa prefix.
      SERVER_NAME: http://localhost
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # --- Source code (bind mount dari host, editable via IDE) ---
      - ./composer.json:/app/composer.json:ro
      - ./config:/app/config
      - ./web/index.php:/app/web/index.php:ro
      - ./web/wp-config.php:/app/web/wp-config.php:ro
      - ./web/app/mu-plugins:/app/web/app/mu-plugins
      - ./web/app/themes:/app/web/app/themes
      - ./plugins-custom:/app/plugins-custom
      # --- Composer-managed ---
      # vendor & plugins pakai named volume (persist antar restart, dependencies gede)
      # WordPress core (/app/web/wp) SENGAJA tidak di-mount: roots/wordpress-core-installer
      # rmdir folder ini dulu sebelum extract, dan mount point Docker tidak bisa di-rmdir.
      # Biarin WP core hidup di container writable layer — re-install fast (~30s) karena
      # package sudah di-cache di vendor/.
      - vendor:/app/vendor
      - plugins:/app/web/app/plugins
      - uploads:/app/web/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    ports:
      - "${DB_PORT:-3306}:3306"

  redis:
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"

volumes:
  vendor:
  plugins:
